<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀란 투자 계약 서명</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 隐藏 Netlify 广告 */
        [data-netlify-identity-menu],
        .netlify-identity-widget,
        [class*="netlify"],
        iframe[src*="netlify"] {
            display: none !important;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 16px;
            opacity: 0.95;
        }
        
        .content {
            padding: 40px;
        }
        
        .contract-view {
            display: block;
        }
        
        .contract-view.hidden {
            display: none;
        }
        
        .form-section {
            display: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        .form-section.active {
            display: block;
            max-height: none;
        }
        
        .preview-section {
            display: none;
            max-height: 0;
            overflow: hidden;
        }
        
        .preview-section.active {
            display: block;
            max-height: none;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .signature-pad {
            width: 100%;
            height: 200px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: crosshair;
            background: white;
        }
        
        .signature-controls {
            margin-top: 10px;
            text-align: right;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            min-height: 20px;
        }
        
        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-message.active {
            display: block;
        }
        
        .success-message h2 {
            margin-bottom: 10px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-download {
            background: #27ae60;
            color: white;
        }
        
        .btn-download:hover {
            background: #229954;
        }
        
        .btn-again {
            background: #3498db;
            color: white;
        }
        
        .btn-again:hover {
            background: #2980b9;
        }
        
        .preview-contract {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 6px;
            line-height: 1.8;
            color: #333;
        }
        
        .preview-contract h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .preview-contract h3 {
            color: #764ba2;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        
        .preview-contract p {
            margin-bottom: 8px;
        }
        
        .preview-signature-img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            padding: 10px;
            background: white;
            border-radius: 4px;
        }
        
        .contract-intro {
            background: #f0f4ff;
            padding: 20px;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .contract-intro h2 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .contract-intro p {
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>귀란 (Ghost Orchid)</h1>
            <p>투자 계약 서명 시스템</p>
        </div>
        
        <div class="content">
            <div class="contract-view" id="contractView">
                <div class="contract-intro">
                    <h2>계약 정보</h2>
                    <p>본 문서는 《귀란》 숏드라마 제작에 대한 공동투자 계약입니다.</p>
                    <p><strong>총 발행주식:</strong> 1,000주 @ USD 2,300/주</p>
                    <p><strong>발행인:</strong> Encore Films Pte. Ltd. (대표: 유경환)</p>
                </div>
                
                <div style="text-align: center; margin-top: 30px;">
                    <button class="btn btn-primary" onclick="startSigning()" style="padding: 15px 40px; font-size: 18px;">계약 서명하기</button>
                </div>
            </div>
            
            <form id="signingForm" class="form-section" style="display: none;">
                <h2 style="margin-bottom: 30px; color: #667eea;">투자자 정보 입력</h2>
                
                <div class="form-group">
                    <label>이름*</label>
                    <input type="text" id="name" name="name" placeholder="예: 김철수" required>
                    <div class="error-message" id="nameError"></div>
                </div>
                
                <div class="form-group">
                    <label>전화번호*</label>
                    <input type="tel" id="phone" name="phone" placeholder="예: 01012345678" required>
                    <div class="error-message" id="phoneError"></div>
                </div>
                
                <div class="form-group">
                    <label>주소*</label>
                    <input type="text" id="address" name="address" placeholder="예: 서울시 강남구 테헤란로 123" required>
                    <div class="error-message" id="addressError"></div>
                </div>
                
                <div class="form-group">
                    <label>인수 주식 수 (최대 1,000주)*</label>
                    <input type="number" id="shares" name="shares" placeholder="예: 100" min="1" max="1000" required>
                    <div class="error-message" id="sharesError"></div>
                </div>
                
                <div class="form-group">
                    <label>서명 (손으로 서명해주세요)*</label>
                    <canvas id="signaturePad" class="signature-pad"></canvas>
                    <div class="signature-controls">
                        <button type="button" class="btn btn-secondary" onclick="clearSignature()">다시 서명</button>
                    </div>
                    <div class="error-message" id="signatureError"></div>
                </div>
                
                <input type="hidden" id="signatureData" name="signature">
                <input type="hidden" name="contractDate" id="contractDate">
                
                <div style="display: flex; gap: 10px; margin-top: 30px;">
                    <button type="button" class="btn btn-secondary" onclick="cancelSigning()" style="flex: 1;">취소</button>
                    <button type="button" class="btn btn-primary" onclick="submitForm()" style="flex: 1;">제출</button>
                </div>
            </form>
            
            <div class="preview-section" id="previewSection">
                <div class="success-message" id="successMessage">
                    <h2>✓ 계약 서명 완료!</h2>
                    <p>서명한 계약서가 아래에 표시됩니다.</p>
                </div>
                
                <div class="preview-contract" id="previewContent">
                    <!-- 미리보기 내용이 여기에 표시됨 -->
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button class="btn btn-download" onclick="downloadContract()" style="flex: 1;">📥 다운로드</button>
                    <button class="btn btn-again" onclick="signAgain()" style="flex: 1;">새로운 계약 서명</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let hasSignature = false;
        let formData = {};
        
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#333';
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
        canvas.addEventListener('touchstart', handleTouchStart);
        canvas.addEventListener('touchmove', handleTouchMove);
        canvas.addEventListener('touchend', stopDrawing);
        
        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
        
        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
            hasSignature = true;
        }
        
        function stopDrawing() {
            isDrawing = false;
            ctx.closePath();
        }
        
        function handleTouchStart(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            ctx.beginPath();
            ctx.moveTo(x, y);
        }
        
        function handleTouchMove(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
            hasSignature = true;
        }
        
        function clearSignature() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasSignature = false;
            document.getElementById('signatureError').textContent = '';
        }
        
        function startSigning() {
            document.getElementById('contractView').style.display = 'none';
            document.getElementById('signingForm').style.display = 'block';
            
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const date = String(today.getDate()).padStart(2, '0');
            document.getElementById('contractDate').value = `${year}-${month}-${date}`;
        }
        
        function cancelSigning() {
            document.getElementById('contractView').style.display = 'block';
            document.getElementById('signingForm').style.display = 'none';
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('signingForm').reset();
            clearSignature();
        }
        
        function validateForm() {
            let isValid = true;
            
            const name = document.getElementById('name').value.trim();
            if (!name) {
                document.getElementById('nameError').textContent = '이름을 입력하세요';
                isValid = false;
            } else {
                document.getElementById('nameError').textContent = '';
            }
            
            const phone = document.getElementById('phone').value.trim();
            if (!phone) {
                document.getElementById('phoneError').textContent = '전화번호를 입력하세요';
                isValid = false;
            } else {
                document.getElementById('phoneError').textContent = '';
            }
            
            const address = document.getElementById('address').value.trim();
            if (!address) {
                document.getElementById('addressError').textContent = '주소를 입력하세요';
                isValid = false;
            } else {
                document.getElementById('addressError').textContent = '';
            }
            
            const shares = document.getElementById('shares').value.trim();
            if (!shares) {
                document.getElementById('sharesError').textContent = '인수 주식 수를 입력하세요';
                isValid = false;
            } else if (parseInt(shares) > 1000) {
                document.getElementById('sharesError').textContent = '최대 1,000주까지 인수 가능합니다';
                isValid = false;
            } else {
                document.getElementById('sharesError').textContent = '';
            }
            
            if (!hasSignature) {
                document.getElementById('signatureError').textContent = '서명을 작성해주세요';
                isValid = false;
            } else {
                document.getElementById('signatureError').textContent = '';
            }
            
            return isValid;
        }
        
        function submitForm() {
            if (!validateForm()) return;
            
            formData = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                shares: document.getElementById('shares').value,
                date: document.getElementById('contractDate').value,
                signature: canvas.toDataURL('image/png')
            };
            
            // 본地 저장
            let savedData = JSON.parse(localStorage.getItem('contractData') || '[]');
            savedData.push(formData);
            localStorage.setItem('contractData', JSON.stringify(savedData));
            
            showPreview();
        }
        
        function showPreview() {
            document.getElementById('signingForm').style.display = 'none';
            document.getElementById('previewSection').style.display = 'block';
            document.getElementById('successMessage').classList.add('active');
            
            const totalAmount = (formData.shares * 2300).toLocaleString();
            
            const previewHTML = `
                <h2>《귀란》(Ghost Orchid) 투자 계약서</h2>
                <p style="text-align: center; color: #666; margin-bottom: 20px;"><strong>공동투자 및 제작 계약</strong></p>
                
                <h3>계약 정보</h3>
                <p><strong>갑 (판권 보유자):</strong> Encore Films Pte. Ltd.</p>
                <p><strong>대표자:</strong> 유경환</p>
                <p><strong>연락처:</strong> +65 6742 5810</p>
                <p><strong>주소:</strong> 18 Kaki Bukit Road 3, #02-20, Entrepreneur Business Centre, Singapore 415978</p>
                
                <h3 style="margin-top: 20px;">을 (투자자) 정보</h3>
                <p><strong>이름:</strong> ${formData.name}</p>
                <p><strong>전화번호:</strong> ${formData.phone}</p>
                <p><strong>주소:</strong> ${formData.address}</p>
                <p><strong>인수 주식 수:</strong> ${formData.shares}주 (주당 USD 2,300)</p>
                <p><strong>총 인수 금액:</strong> USD ${totalAmount}</p>
                
                <h3 style="margin-top: 20px;">서명</h3>
                <div style="margin-top: 20px; padding: 20px; border: 2px solid #333; border-radius: 8px; background: white;">
                    <p><strong>을의 서명:</strong></p>
                    <img src="${formData.signature}" class="preview-signature-img" alt="서명">
                    <p style="margin-top: 15px;"><strong>서명 날짜:</strong> ${formData.date}</p>
                </div>
            `;
            
            document.getElementById('previewContent').innerHTML = previewHTML;
        }
        
        function downloadContract() {
            const link = document.createElement('a');
            link.href = formData.signature;
            link.download = `contract-signed-${formData.name}-${new Date().getTime()}.png`;
            link.click();
        }
        
        function signAgain() {
            cancelSigning();
        }
    </script>
</body>
</html>
